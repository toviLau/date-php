<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DEMO - date-php</title>
    <script src="../dist/date.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/vue/3.5.13/vue.global.prod.min.js"></script>
    <style>
        html,
        body,
        .main {
            height: 100%;
            overflow: hidden;
            padding: 0;
            margin: 0;
            width: 100%;
        }

        .main {
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            padding: 0.5em 1em;
            box-sizing: border-box;
            flex: 1;
            overflow: auto;
        }

        #app {
            height: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .date-editer {
            font-size: 16px;
            line-height: 2em;
            padding: 1.6em 0.5em 0.5em;
            border: 1px solid #ccc;
            position: relative;
            margin: 1em auto;
            width: 100%;
            box-sizing: border-box;
        }

        .date-editer::before {
            content: '试一试(try) - version:' attr(data-version);
            position: absolute;
            top: -1em;
            left: 2em;
            padding: 0 0.5em;
            background-color: #fff;
        }

        .table {
            flex: 1;
            overflow: auto;
            border-right: 1px solid #ccc;
            border-bottom: 1px solid #ccc;
            font-size: 12px;
        }

        .table #now-time {
            background-color: #eeeeff;
        }

        .table td,
        .table th {
            border-width: 1px 0 0 1px;
            border-style: solid;
            border-color: #ccc;
            padding: 2px 0;
        }

        .table th {
            line-height: 2.2em;
            background-color: #d9d9d9;
        }

        .table .block,
        .table .clock {
            padding: 2px 6px;
        }

        .table td .block:nth-child(2) {
            border-top: 1px solid #ccc;
        }

        .table tbody tr:hover td {
            background-color: #def;
        }

        .table tbody tr:nth-child(even) {
            background-color: #f0f0f0;
        }

        .table tbody tr:nth-child(odd):hover td:nth-last-child(4) {
            background-color: #fff;
        }

        .table .date-params {
            color: #c33;
            font-weight: bold;
        }

        .table .date-object {
            color: #393;
            font-weight: bold;
        }

        .date-time::before {
            content: attr(data-label);
        }

        .tips {
            color: #ddd;
            font-size: 12px;
            display: inline-block;
        }

        .tips::before {
            content: attr(data-label);
        }

        .date-input {
            outline: none;
            border: none;
            border-bottom: 1px dashed #999;
            font-size: 16px;
            display: inline;
            background: none;
            height: 1.5em;
            padding: 0 0.35em;
        }

        .date-input::placeholder {
            color: #ddd;
        }

        .tips:focus-within::before {
            color: #333;
        }

        .tips:focus-within .date-input:focus {
            border-bottom: 2px solid #666;
            background-color: #f0fccf;
        }

        .date-input-isms {
            width: 2.5em;
        }

        .date-input-template {
            width: 120px;
        }

        .date-input-dateTime {
            width: 120px;
        }

        .succ {
            color: #666;
            white-space: nowrap;
            font-size: 0.7em;
            background: #f3f3f3;
            border: 1px solid #e6e6e6;
            padding: 0.25em 0.5em;
            border-radius: 3px;
        }

        .fixed-btns {
            position: fixed;
            bottom: 2em;
            right: 1em;
            width: 180px;
            opacity: 0.2;
        }

        .fixed-btns:hover {
            opacity: 0.8;
        }

        .time-editer-li {
            padding: 0.25em 1em;
            border-radius: 5px;
        }

        .time-editer-li::before {
            content: 'date(';
            margin-right: 0.25em;
            color: #333;
        }

        .time-editer-li:focus-within {
            background-color: #f0f9fc;
            box-shadow: 0 0 1px #c3c3c3;
        }

        .time-editer-li.duration::before {
            content: 'date.duration(';
        }

        .time-editer-li.chain::before {
            content: 'date.chain(';
        }

        .time-editer-li .tips:nth-last-child(2)::after {
            content: ')';
            font-size: 20px;
            margin-right: 0.5em;
            color: #333;
        }

        .time-editer-li .tips:not(:last-child)::after {
            content: ',';
            font-size: 16px;
            color: #666;
            margin-right: 0.25em;
        }

        .copyright {
            font-size: 12px;
            line-height: 2em;
            text-align: center;
            background-color: #3c3c3c;
            color: #ccc;
            border-bottom: 1px solid #f0f0f0;
        }

        .copy-link {
            color: inherit;
            text-decoration: none;
        }

        .copy-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div id="app">
    <div class="main">
        <div class="date-editer" :data-version="version">
            <!--date(...)-->
            <div class="time-editer-li" v-for="(item, idx) in dataList" :key="idx">
                <span class="tips" data-label="template?">
                    <input type="text" class="date-input" placeholder="Y-m-d" v-model="item.template" />
                </span>
                <span class="tips" data-label="dateTime?">
                    <input type="text" class="date-input" :placeholder="Date.now()" v-model="item.dateTime" />
                </span>
                <span class="tips" data-label="isMs?">
                    <input type="text" class="date-input date-input-isms" v-model.trim="item.isMs" placeholder="true" />
                </span>
                <span class="succ" v-text="formatDate(item)"></span>
            </div>

            <!--date.duration(...)-->
            <div class="time-editer-li duration" v-for="(item, idx) in durationList" :key="'d'+idx">
                <span class="tips" data-label="template?">
                    <input type="text" class="date-input date-input-template" placeholder="D天h:i:s" v-model="item.template" />
                </span>
                <span class="tips" data-label="datetime?">
                    <input type="text" class="date-input date-input-dateTime" :placeholder="0" v-model="item.dateTime" />
                </span>
                <span class="tips" data-label="isMs?">
                    <input type="text" class="date-input date-input-isms" v-model="item.isMs" placeholder="true" />
                </span>
                <span class="succ" v-text="formatDuration(item)"></span>
            </div>
        </div>

        <!-- all params table -->
        <table class="table" border="0" cellspacing="0">
            <thead id="now-time">
                <tr>
                    <td colspan="4">
                        <div class="clock">
                            <span data-label="当前时间：" class="date-time"></span>
                        </div>
                        <div class="clock">
                            <span data-label="now time：" class="date-time"></span>
                        </div>
                    </td>
                </tr>
            </thead>
            <thead>
                <tr>
                    <th>模板字符<br />(Template character)</th>
                    <th>时间对象<br />(Datetime object)</th>
                    <th>
                        代码(
                        <span class="date-object">时间对象 </span>
                        <span class="date-params">模板字符</span>
                        )<br />
                        code(
                        <span class="date-object">Datetime object </span>
                        <span class="date-params">Template character</span>
                        )
                    </th>
                    <th>输出<br />(output)</th>
                </tr>
            </thead>
            <tbody>
                <template v-for="(item, idx) in chars" :key="idx">
                    <tr v-for="(cItem, cIdx) in daters" :key="cIdx">
                        <td :rowspan="daters.length" v-if="cIdx === 0">
                            <div class="block date-params" v-text="item"></div>
                        </td>
                        <td>
                            <div class="block date-object" v-text="cItem"></div>
                        </td>
                        <td>
                            <div class="block">
                                date("<span class="date-params" v-text="item"></span>",
                                <span class="date-object" v-text="cItem"></span>)
                            </div>
                            <div class="block">
                                new Date("<span class="date-object" v-text="cItem"></span>").format("<span class="date-params" v-text="item"></span>")
                            </div>
                        </td>
                        <td>
                            <div class="block" v-text="date(item, resolveDateTime(cItem))"></div>
                            <div class="block" v-text="new Date(resolveDateTime(cItem)).format(item)"></div>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

    <div class="copyright">
        &copy; <a target="_blank" class="copy-link" href="https://www.npmjs.com/package/date-php">ToviLau</a> 2026&ndash;Present
    </div>

    <div class="fixed-btns">
        <a href="https://github.com/toviLau/date-php" target="_blank" class="back github">
            <img src="https://img.shields.io/github/package-json/v/tovilau/date-php?label=%E8%BF%94%E5%9B%9E%20Github&logo=github" height="25" alt="返回 Github" />
        </a>
        <a href="https://www.npmjs.com/package/date-php" target="_blank" class="back npm">
            <img src="https://img.shields.io/npm/v/date-php?label=%E8%BF%94%E5%9B%9E%20NPM&logo=npm" height="25" alt="返回 Npm" />
        </a>
    </div>
</div>

<script>
const { createApp, reactive, ref } = Vue;

createApp({
    setup() {
        const _timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;

        const version = ref(date.version);

        const dataList = reactive([
            {
                template: 'Y-m-d H:i',
                dateTime: new Date().toString(),
                isMs: '!false',
            },
            {
                template: 'Y-m-d H:i',
                dateTime: ~~(Date.now() * 0.001),
                isMs: '!1',
            },
            {
                template: 'y-m-d',
                dateTime: Date.now() - 0,
            },
            {
                template: 'm-d H:i 周 w, 第 W 周',
                dateTime: ~~(Date.now() * 0.001) - 15 * 24 * 60 * 60,
                isMs: false,
            },
            {
                template: '\\I \\l\\o\\v\\e \\y\\o\\u',
                dateTime: Date.now(),
                isMs: 'true',
            },
            {
                template: 'H:i:s R [e]',
                dateTime: date('Y-m-d H:i:s', Date.now() - 12 * 60 * 1000),
            },
            {
                template: 'H:i:s R [e]',
                dateTime: new Date(Date.now() - 25 * 1000).getTime(),
                isMs: true,
            },
            {
                template: 'H:i:s R [e]',
                dateTime: ~~(Date.now() * 0.001),
                isMs: !true,
            },
        ]);

        const durationList = reactive([
            {
                template: 'd天 h小时i分种',
                dateTime: 106660800,
                isMs: true,
            },
            {
                template: 'H小时i分种',
                dateTime: 106660800,
            },
            {
                template: 'H\\hour i\\m\\i\\nute\\s',
                dateTime: 106660800,
            },
            {
                template: 'H:i:s',
                dateTime: 106660,
                isMs: false,
            },
            {
                template: 'H:i:s',
                dateTime: 106660,
            },
            {
                template: 'D \\d\\a\\y h:i:s',
                dateTime: 106660,
                isMs: false,
            },
        ]);

        const daters = reactive([
            'new Date()',
            '2018-01-01',
            '2020-01-07',
            '2020-01-24',
            '2020-05-12',
            '2020-09-12',
            '2021-09-13',
            '2020-10-24',
            '2019-12-24 20:23:52',
        ]);

        const chars = reactive([
            'Y-m-d fh - lh',
            'Y-m-d H:i:s lq lQ q Q n',
            'Y-m-d 第W周 lq lQ q Q n',
            'Y-m-d 周w lg lG',
            '公历(阳历)：C(Y)年f月k日 星期K',
            '农历(阴历)：lC(lc)年lm月ld lt时lk刻',
            'ly年lf月lj日 生肖lz lS ls',
            'lj lf ly lc lC lz lZ la lM',
            'o-m-d H:i:s.v',
        ]);

        const parseBool = (val) => {
            if (typeof val === 'boolean') return val;
            if (['', undefined, null].includes(val)) return undefined;
            const _val = val.match(/(\!*)([^\s]*)/i);
            const isNot = _val[1].length % 2 === 1;
            const isFalse = /^(0|false|null|undefined)$/.test(_val[2]);
            return isNot ? isFalse : !isFalse;
        };

        const formatDate = (item) => {
            let dateTime = item.dateTime;
            if (dateTime && typeof dateTime === 'object' && typeof dateTime.getTime === 'function') {
                dateTime = dateTime.getTime();
            } else {
                const num = Number(dateTime);
                dateTime = num.toString() !== 'NaN' ? num : dateTime;
            }
            return date(item.template || 'Y-m-d', dateTime, parseBool(item.isMs));
        };

        const formatDuration = (item) => {
            const ts = item.dateTime - 0;
            return date.duration(item.template, ts, parseBool(item.isMs));
        };

        const resolveDateTime = (cItem) => {
            try {
                const d = new Date(cItem);
                if (d.toString() !== 'Invalid Date') return cItem;
            } catch (e) {}
            return Date.now();
        };

        const nowClock = document.getElementsByClassName('date-time');
        setInterval(() => {
            for (let i = 0; i < nowClock.length; i += 1) {
                nowClock[i].innerHTML = date('Y-m-d H:i:s.v');
            }
        }, 1000);

        return {
            version,
            dataList,
            durationList,
            daters,
            chars,
            date: date.bind(null),
            formatDate,
            formatDuration,
            resolveDateTime,
            Date: window.Date,
        };
    },
}).mount('#app');
</script>
</body>
</html>
